<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEACONLIGHT — The Lighthouse Job</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #test-results { display: none; position: fixed; left: 8px; top: 8px; z-index: 10; background: #fff; color: #111; font: 13px monospace; white-space: pre; padding: 8px; max-width: 90vw; }
</style>
</head>
<body>
<canvas id="game" aria-label="Beaconlight: a top-down stealth game. Slip past the keepers, steal the light, escape unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="test-results"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
